<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintDrop test page</title>
    <link rel="stylesheet" href="css/base.css">
    <style>
         .badge {
             display: inline-block;
             padding: var(--space-1) var(--space-3);
             border-radius: var(--radius);
             font-size: var(--text-sm);
             color: #ffffff;
      }
      
        .badge-new { background: var(--status-new); }
        .badge-processing { background: var(--status-processing); }
        .badge-ready { background: var(--status-ready); }
        .badge-completed { background: var(--status-completed); }
        .badge-cancelled {background: var(--status-cancelled);}

        .btn {
            background: var(--color-accent);
            color: #ffffff;
            border: none;
            padding: var(--space-3) var(--space-6);
            border-radius: var(--radius);
            cursor: pointer;
        }

        .btn:hover {
            background: var(--color-accent-dark);
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-4);
        }
    </style>
</head>
<body>
    <!-- Badge -->
    <span class="badge badge-new">New</span>
    <span class="badge badge-processing">Processing</span>
    <span class="badge badge-ready">Ready for collection</span>
    <span class="badge badge-completed">Completed</span>
    <span class="badge badge-cancelled">Cancelled</span>  

    <!-- Upload Button -->
    <button class="btn">Upload Document</button>
    
        <div class="row">
           <span>Copies</span>
           <span>2</span>
        </div>
</body>
</html>
